<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
  <style>
    body { margin: 0; }
    #app { width: 400px; height: 580px; margin: 0; border: none; border-radius: 0; }
    #app .ytx-header { padding: 12px 16px; }
    #app.pop-home { height: auto; }
    .pop-value { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .pop-badge {
      font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 500; color: var(--ytx-accent);
      border: 1px solid var(--ytx-border); border-radius: 6px; padding: 2px 7px;
      max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #app button:focus-visible, #app input:focus-visible, #app select:focus-visible {
      outline: 2px solid var(--ytx-accent); outline-offset: 1px;
    }
  </style>
</head>
<body>
  <div class="ytx-panel" id="app" data-ytx-theme="light">
    <div class="ytx-header">
      <svg width="20" height="20" viewBox="0 0 24 24" class="ytx-header-icon"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 13h6"></path><path d="M16.5 13H17"></path><path d="M7 16h2.5"></path><path d="M12.5 16H17"></path></svg>
      <div class="ytx-title">AI 번역 스크립트</div>
      <div class="ytx-header-spacer"></div>
      <button class="ytx-icon-btn" id="gear" title="설정" aria-label="설정" aria-pressed="false">

      </button>
    </div>
    <div class="ytx-body" id="body"></div>
  </div>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
